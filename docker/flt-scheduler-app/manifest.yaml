apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flt-scheduler-data
  labels:
    app: flt-scheduler
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flt-scheduler
  labels:
    app: flt-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flt-scheduler
  template:
    metadata:
      labels:
        app: flt-scheduler
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                      - arm64
      containers:
        - name: flt-scheduler
          image: flt-scheduler:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SECRET_KEY
              value: "change-me-in-production"
            - name: DEFAULT_ADMIN_USER
              value: "admin"
            - name: DEFAULT_ADMIN_PASSWORD
              value: "admin123"
            # Database configuration
            - name: DATABASE_TYPE
              value: "sqlite"  # or "postgresql"
            - name: SQLITE_DB_PATH
              value: "/app/data/scheduler.db"  # REQUIRED for SQLite
            # Uncomment for PostgreSQL:
            # - name: DATABASE_URL
            #   value: "postgresql://user:pass@postgres-service:5432/flight_scheduler"
          volumeMounts:
            - name: app-data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 128Mi
            limits:
              cpu: "4"
              memory: 512Mi
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: flt-scheduler-data
---
apiVersion: v1
kind: Service
metadata:
  name: flt-scheduler
  labels:
    app: flt-scheduler
spec:
  selector:
    app: flt-scheduler
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
